[GENERAL]
mode = multi
relation_model = ABLUP
output_dir = ./runs/multi

[PATHS]
pedigree_file = ./data/pedigree.tsv
phenotype_file = ./data/phenotype.csv
bed_file_basename =

[COLUMNS]
ped_col_id = 1
ped_col_sire = 2
ped_col_dam = 3
pheno_col_id = 1

[MODEL_PARAMS_MULTI]
G0 = [[1.0, 0.2], [0.2, 1.0]]
R0 = [[1.0, 0.1], [0.1, 1.0]]
random_effect_names =
random_covariances = {}

[T1]
trait_col = 4
fixed_effects = 2,3
covariates =
random_effects =
random_ratios =

[T2]
trait_col = 5
fixed_effects = 2,3
covariates =
random_effects =
random_ratios =

[ADVANCED]
num_threads = 4
max_solver_iterations = 15000
final_rtol = 1e-6
final_atol = 1e-6
enable_solver_health_diagnostics = false
solver_strategy = auto
