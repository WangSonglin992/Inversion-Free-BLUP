[GENERAL]
mode = single
relation_model = ABLUP
output_dir = ./runs/single

[PATHS]
pedigree_file = ./data/pedigree.tsv
phenotype_file = ./data/phenotype.csv
bed_file_basename =

[COLUMNS]
ped_col_id = 1
ped_col_sire = 2
ped_col_dam = 3
pheno_col_id = 1

[MODEL_PARAMS_SINGLE]
trait_col = 4
fixed_effects = 2,3
covariates =
h2 = 0.30
random_effects =
random_ratios =

[ADVANCED]
num_threads = 4
max_solver_iterations = 15000
final_rtol = 1e-6
final_atol = 1e-6
enable_solver_health_diagnostics = false
solver_strategy = auto
